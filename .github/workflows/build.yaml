name: Build API

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to build (defaults to the triggering commit)
        type: string
        required: false

jobs:
  build-api:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          # Full history: `updatedAt` comes from the last commit touching the data file
          fetch-depth: 0
      - uses: jdx/mise-action@v4
      - uses: actions/setup-node@v7
        with: { cache: yarn, package-manager-cache: yarn }

      - run: yarn install --immutable
      - run: yarn workspace @bikelencia/api build
      - uses: actions/upload-pages-artifact@v5
        with: { path: api/public }

  deploy-api:
    needs: build-api
    runs-on: ubuntu-latest

    concurrency:
      group: pages
      cancel-in-progress: false

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
