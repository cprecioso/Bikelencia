name: Refresh data

on:
  schedule:
    - cron: "0 0 * * *" # Every day at midnight
  workflow_dispatch:

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh-data:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    outputs:
      sha: ${{ steps.push.outputs.sha }}

    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: actions/setup-node@v7
        with: { cache: yarn, package-manager-cache: yarn }

      - run: yarn install --immutable
      - run: yarn run refresh
        working-directory: data

      - run: git config --global user.name "github-actions[bot]"
      - run: git config --global user.email "github-actions[bot]@users.noreply.github.com"
      - run: git add data
      - run: git commit -m "Refresh data" || echo "No changes to commit"
      - id: push
        run: |
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Pushes made with GITHUB_TOKEN don't trigger other workflows, so call the build directly
  build:
    needs: refresh-data
    uses: ./.github/workflows/build.yaml
    with:
      ref: ${{ needs.refresh-data.outputs.sha }}
    permissions:
      contents: read
      pages: write
      id-token: write
